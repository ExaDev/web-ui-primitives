name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library (dual ESM/CJS, verified with attw)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.published.outputs.published }}
      version: ${{ steps.published.outputs.version }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          # Do NOT set registry-url: it creates an .npmrc that overrides OIDC

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm run build

      - name: Record the latest release before this run
        id: release-before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect whether this run published a release
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_BEFORE: ${{ steps.release-before.outputs.tag }}
        run: |
          tag_after=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$tag_after" = "$TAG_BEFORE" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag_after#v}" >> "$GITHUB_OUTPUT"
          fi

  # Tells agent-comms, the only repository that consumes this package, to bump to the version this run published. The dispatch needs an App token: the workflow token cannot trigger a workflow in another repository.
  notify-agent-comms:
    name: Notify agent-comms
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate a token for the dispatch
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The ExaDev Sync app, installed on every repository in the organisation. Its id is public, so it is written out here rather than read from a variable.
          app-id: "4816274"
          private-key: ${{ secrets.EXADEV_SYNC_PRIVATE_KEY }}
          owner: ExaDev
          repositories: agent-comms

      - name: Dispatch sibling-released
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: web-ui-primitives
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/ExaDev/agent-comms/dispatches \
            -f event_type=sibling-released \
            -F "client_payload[package]=$PACKAGE" \
            -F "client_payload[version]=$VERSION"
